name: Deploy TaskFlow

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: crm-deploy
  cancel-in-progress: false

env:
  PHP_VERSION: "8.5"
  PHP_BIN: /usr/local/php85/bin/php
  APP_ROOT: /home/aic7997609/crm.aictx.ru/app
  WEB_ROOT: /home/aic7997609/crm.aictx.ru/docs
  SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
  HOST_KEY_FINGERPRINT: SHA256:f8R0Xldc8hBPfdyQVEm7+UMG3Y27F8TQDFMmips/+R0

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, xml, ctype, tokenizer, curl, fileinfo, openssl, zip
          coverage: none

      - name: Syntax check
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -name '*.php' -type f -print0 \
            | xargs -0 -r -n1 -P4 php -l

      - name: Validate composer.json
        run: composer validate --no-check-all --no-check-publish

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, xml, ctype, tokenizer, curl, fileinfo, openssl, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run build

      - name: Install dependencies
        run: |
          set -euo pipefail
          composer install --no-dev --no-interaction --prefer-dist \
            --optimize-autoloader --no-progress

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "$SSH_PORT" -t rsa "$SSH_HOST" 2>/dev/null > ~/.ssh/known_hosts
          fp="$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')"
          if [ "$fp" != "$HOST_KEY_FINGERPRINT" ]; then
            echo "::error::Host key fingerprint mismatch: got ${fp}"
            exit 1
          fi

          cat > ~/.ssh/config <<EOF
          Host nic-crm
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            PasswordAuthentication no
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedAlgorithms +ssh-rsa
          EOF

      - name: Sync code
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ssh nic-crm "REPO='${REPO}' APP_ROOT='${APP_ROOT}' WEB_ROOT='${WEB_ROOT}' bash -s" <<'REMOTE'
          set -euo pipefail

          mkdir -p "${APP_ROOT}"
          cd "${APP_ROOT}"

          if [ -d .git ]; then
            git fetch --prune origin main
            git reset --hard origin/main
          else
            git init -q
            git remote add origin "https://github.com/${REPO}.git"
            git fetch --depth 1 origin main
            git reset --hard FETCH_HEAD
          fi

          git clean -fdq -e .env -e vendor/ -e storage/

          mkdir -p storage/framework/cache/data storage/framework/sessions \
                   storage/framework/views storage/logs bootstrap/cache

          echo "==> Code at $(git rev-parse --short HEAD)"
          REMOTE

      - name: Upload vendor
        run: |
          set -euo pipefail
          tar -czf - vendor | ssh nic-crm "tar -xzf - -C '${APP_ROOT}'"

      - name: Publish docroot
        run: |
          set -euo pipefail
          ssh nic-crm "APP_ROOT='${APP_ROOT}' WEB_ROOT='${WEB_ROOT}' bash -s" <<'REMOTE'
          set -euo pipefail

          mkdir -p "${WEB_ROOT}"
          rsync -a --delete \
            --exclude 'index.php' --exclude '.htaccess' --exclude 'robots.txt' --exclude 'storage' \
            --exclude 'assets' --exclude 'index.html' --exclude 'favicon.svg' \
            "${APP_ROOT}/public/" "${WEB_ROOT}/"

          install -m 644 "${APP_ROOT}/deploy/docroot/index.php" "${WEB_ROOT}/index.php"
          install -m 644 "${APP_ROOT}/deploy/docroot/.htaccess" "${WEB_ROOT}/.htaccess"
          install -m 644 "${APP_ROOT}/deploy/docroot/robots.txt" "${WEB_ROOT}/robots.txt"
          ln -sfn "${APP_ROOT}/storage/app/public" "${WEB_ROOT}/storage"

          echo "==> Docroot published to ${WEB_ROOT}"
          REMOTE

      - name: Publish frontend
        run: |
          set -euo pipefail
          tar -czf - -C frontend/dist . \
            | ssh nic-crm "mkdir -p '${WEB_ROOT}/assets' && tar -xzf - -C '${WEB_ROOT}' && find '${WEB_ROOT}/assets' -type f -mtime +30 -delete && chmod -R a+rX '${WEB_ROOT}' && echo '==> SPA published'"

      - name: Migrate and optimize
        run: |
          set -euo pipefail
          ssh nic-crm "APP_ROOT='${APP_ROOT}' PHP_BIN='${PHP_BIN}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "${APP_ROOT}"

          chmod -R ug+rwX storage bootstrap/cache

          "${PHP_BIN}" artisan migrate --force
          "${PHP_BIN}" artisan db:seed --force
          "${PHP_BIN}" artisan package:discover --ansi
          "${PHP_BIN}" artisan optimize
          "${PHP_BIN}" artisan storage:link || true

          echo "==> Deployed: $("${PHP_BIN}" artisan --version)"
          REMOTE
